<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#150829"/>
      <stop offset="40%" stop-color="#4b1d80"/>
      <stop offset="72%" stop-color="#c92f75"/>
      <stop offset="100%" stop-color="#ff7a3c"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fff5c2"/>
      <stop offset="35%" stop-color="#ffb84d"/>
      <stop offset="70%" stop-color="#ff5f6d"/>
      <stop offset="100%" stop-color="#ff2e63"/>
    </radialGradient>
    <clipPath id="typeClip">
      <rect x="78" y="38" width="0" height="86">
        <animate attributeName="width" values="0;0;400;400;0" keyTimes="0;0.08;0.25;0.99;1" dur="14s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="600" height="150" fill="url(#sky)"/>

  <!-- stars -->
  <circle cx="40" cy="18" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="90" cy="35" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="150" cy="14" r="1.4" fill="#ffffff" opacity="0.7"/>
  <circle cx="220" cy="28" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="480" cy="20" r="1.3" fill="#ffffff" opacity="0.7"/>
  <circle cx="540" cy="38" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="560" cy="16" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- sun -->
  <circle cx="300" cy="95" r="42" fill="url(#sun)"/>
  <rect x="258" y="105" width="84" height="4" fill="#150829" opacity="0.55"/>
  <rect x="258" y="113" width="84" height="4" fill="#150829" opacity="0.55"/>
  <rect x="258" y="121" width="84" height="4" fill="#150829" opacity="0.55"/>
  <rect x="258" y="129" width="84" height="6" fill="#150829" opacity="0.55"/>

  <!-- perspective grid -->
  <g stroke="#00f5d4" stroke-width="1" opacity="0.5">
    <line x1="-60" y1="150" x2="300" y2="95"/>
    <line x1="60" y1="150" x2="300" y2="95"/>
    <line x1="180" y1="150" x2="300" y2="95"/>
    <line x1="300" y1="150" x2="300" y2="95"/>
    <line x1="420" y1="150" x2="300" y2="95"/>
    <line x1="540" y1="150" x2="300" y2="95"/>
    <line x1="660" y1="150" x2="300" y2="95"/>
  </g>
  <g stroke="#ff2e63" stroke-width="1" opacity="0.3">
    <line x1="0" y1="112" x2="600" y2="112"/>
    <line x1="0" y1="126" x2="600" y2="126"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
  </g>

  <!-- terminal panel -->
  <rect x="60" y="32" width="480" height="98" rx="10" fill="#05010f" fill-opacity="0.55" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- terminal content -->
  <g id="termContent" font-family="'Courier New', monospace" font-size="15">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.08;0.85;0.93;1" dur="14s" repeatCount="indefinite"/>
    <g clip-path="url(#typeClip)">
      <text x="80" y="55" fill="#7CFFE0">&gt; booting agentic_systems.exe</text>
      <text x="80" y="75" fill="#7CFFE0">&gt; loading F1_telemetry_engine...</text>
      <text x="80" y="95" fill="#7CFFE0">&gt; initializing multi_agent_council...</text>
      <text x="80" y="115" fill="#ff3cac">&gt; status: online<tspan>_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</svg>
